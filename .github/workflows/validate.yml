name: Validate website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build with GitHub Pages dependencies
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
      - name: Check generated routes and local links
        run: python3 scripts/check_site.py
