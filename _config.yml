# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# ======================
# Site Settings
# ======================
locale                   : "en-US"
title                    : "Jingzhou Hu"
title_separator          : "-"
name                     : "Jingzhou Hu"
description              : "Machine learning researcher focusing on representation learning, optimization, adaptive decision-making, and large language model systems."

# GitHub Pages (user site)
url                      : "https://jingzhouhu.github.io"
baseurl                  : ""
repository               : "JingzhouHu/jingzhouhu.github.io"

breadcrumbs              : false
words_per_minute         : 160
future                   : false
read_more                : "disabled"
# ======================
# Comments (disabled)
# ======================
comments:
  provider               : false

# ======================
# Atom Feed
# ======================
atom_feed:
  path                   :

# ======================
# SEO
# ======================
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :

# ======================
# Social Sharing
# ======================
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 :

social                   : false

# ======================
# Analytics (disabled)
# ======================
analytics:
  provider               : false

# ======================
# Author (Sidebar)
# ======================
author:
  name             : "Jingzhou Hu"
  avatar           : "Hu.png"
  bio              : "Applied Scientist at Amazon, Ph.D."
  location         : "United States"
  googlescholar    : "https://scholar.google.com/citations?user=T6FpaqMAAAAJ&hl=en"
  github           :
  email            :
  links:
    - label: "LinkedIn"
      icon: "fab fa-linkedin"
      url: "https://www.linkedin.com/in/jingzhouhu/"

# ======================
# Reading Files
# ======================
include:
  - .htaccess
  - _pages

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# ======================
# Conversion
# ======================
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# ======================
# Markdown Processing
# ======================
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# ======================
# Defaults
# ======================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      published: false

  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# ======================
# Sass
# ======================
sass:
  sass_dir: _sass
  style: compressed

# ======================
# Output
# ======================
permalink: /:categories/:title/
timezone: America/Los_Angeles

# ======================
# Plugins
# ======================
plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-sitemap
  - jekyll-redirect-from

# ======================
# HTML Compression
# ======================
compress_html:
  clippings: all
  ignore:
    envs: development
